<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Fathul Qorib</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f8fafc;
            color: #334155;
        }
        h1 { text-align: center; color: #0f172a; }
        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        #hasil { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Kamus Fikih Fathul Qorib</h1>
    <p style="text-align: center;">Kamus saku offline untuk istilah fikih</p>
    
    <!-- Kotak pencarian -->
    <input type="text" id="inputCari" class="search-box" placeholder="Cari istilah fikih atau latinnya...">
    
    <!-- Tempat hasil pencarian akan muncul -->
    <div id="hasil">
        <p style="text-align: center; color: #64748b;">Ketik sesuatu untuk mulai mencari...</p>
    </div>

</body>
</html>
